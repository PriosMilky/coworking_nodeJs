<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan - CO&CO HUB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .booking-card { margin-top: 40px; margin-bottom: 40px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">CO&CO HUB</a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card booking-card">
                    <div class="card-header bg-white text-center pt-4 pb-3 border-0">
                        <h4 class="fw-bold text-primary">Form Pemesanan</h4>
                        <p class="text-muted">Isi data untuk memesan ruangan</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="bookingForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nama Lengkap</label>
                                <input type="text" class="form-control" id="customer_name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">No. WhatsApp</label>
                                <input type="tel" class="form-control" id="customer_phone" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Pilih Ruangan</label>
                                <select class="form-select" id="room_id" required></select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Tanggal</label>
                                <input type="date" class="form-control" id="booking_date" required>
                            </div>
                            <div class="row mb-3">
                                <div class="col">
                                    <label class="form-label fw-bold">Jam Mulai</label>
                                    <input type="time" class="form-control" id="start_time" required>
                                </div>
                                <div class="col">
                                    <label class="form-label fw-bold">Jam Selesai</label>
                                    <input type="time" class="form-control" id="end_time" required>
                                </div>
                            </div>
                            <div class="alert alert-secondary d-flex justify-content-between">
                                <span class="fw-bold">Total Biaya</span>
                                <strong id="totalDisplay" class="text-primary">Rp 0</strong>
                            </div>
                            <input type="hidden" id="total_price" value="0">
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Lanjut ke Pembayaran</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { getRooms, submitBooking } from './main.js';

        let rooms = [];

        // 1. Load ruangan dari database
        async function loadRooms() {
            rooms = await getRooms();
            const select = document.getElementById('room_id');
            select.innerHTML = rooms.map(r =>
                `<option value="${r.id}" data-price="${r.price_per_hour}">${r.name} - Rp ${Number(r.price_per_hour).toLocaleString('id')}/jam</option>`
            ).join('');
            // Prefill dari query param ?room=1 (dari tombol "Pesan Sekarang" di index.html)
            const pre = new URLSearchParams(window.location.search).get('room');
            if (pre) select.value = pre;
            hitungTotal();
        }

        // 2. Hitung total = durasi jam x harga
        function hitungTotal() {
            const sel = document.getElementById('room_id');
            const opt = sel.selectedOptions[0];
            const price = opt ? Number(opt.dataset.price) : 0;
            const start = document.getElementById('start_time').value;
            const end = document.getElementById('end_time').value;
            let total = 0;
            if (start && end) {
                const jam = (new Date('2000-01-01T' + end) - new Date('2000-01-01T' + start)) / 3600000;
                if (jam > 0) total = jam * price;
            }
            document.getElementById('totalDisplay').innerText = 'Rp ' + Math.round(total).toLocaleString('id');
            document.getElementById('total_price').value = total;
        }

        document.getElementById('room_id').addEventListener('change', hitungTotal);
        document.getElementById('start_time').addEventListener('change', hitungTotal);
        document.getElementById('end_time').addEventListener('change', hitungTotal);

        // 3. Submit ke backend
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const result = await submitBooking({
                customer_name: document.getElementById('customer_name').value,
                customer_phone: document.getElementById('customer_phone').value,
                room_id: parseInt(document.getElementById('room_id').value),
                booking_date: document.getElementById('booking_date').value,
                start_time: document.getElementById('start_time').value,
                end_time: document.getElementById('end_time').value,
                total_price: parseFloat(document.getElementById('total_price').value)
            });
            if (result) {
                alert(`Booking berhasil! Kode Anda: ${result.booking_code}\nSimpan kode ini untuk cek status.`);
                window.location.href = 'upload.html';
            }
        });

        loadRooms();
    </script>
</body>
</html>
